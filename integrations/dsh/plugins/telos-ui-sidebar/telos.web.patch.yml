# Telos preserves every row from DSH's default Web composition except this
# presentation-only sidebar replacement.
- id: ui-sidebar
  disabled: true
- insert:
    - id: telos-ui-sidebar
      name: '@telos/dsh-client-ui-sidebar'
    - id: telos-continuity
      name: '@telos/dsh-continuity'
      config:
        databasePath: !!js dshHomePath('telos', 'personal-continuity.sqlite')
        maxRecallClaims: 8
        maxRecallChars: 2400
        graphDepth: 2
        captureTurnSources: true
        queueInference: true
        formationMaxInputBytes: 16000
        formationMaxOutputTokens: 4096
        formationTimeoutMs: 60000
    - id: telos-mcp-manager
      name: '@telos/dsh-mcp-manager'
      config:
        storePath: !!js dshHomePath('telos', 'mcp-servers.json')
