appId: ai.telos.desktop
productName: Telos
copyright: Copyright © 2026 Telos contributors
asar: true
npmRebuild: false
compression: normal
afterPack: build/after-pack.mjs

directories:
  output: ../../dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!out/**/*.map'

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: codexiaoke
  repo: telos
  releaseType: release

mac:
  category: public.app-category.productivity
  # Release builds are signed with the Developer ID certificate injected by CI
  # and notarized before electron-builder creates downloadable artifacts.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip

dmg:
  sign: true

win:
  # The packaged DSH closure is production-only and symlink-free, so standard
  # NSIS can provide a complete offline installer without a paid certificate.
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Telos

linux:
  category: Utility
  executableName: telos
  target:
    - AppImage
    - deb
