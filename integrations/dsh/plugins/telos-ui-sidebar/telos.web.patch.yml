# Telos preserves DSH's workspace/session model. It replaces the single-folder
# chooser surface while retaining the upstream native picker backend.
- id: directory-picker
  disabled: true
- id: ui-sidebar
  disabled: true
- insert:
    - id: telos-directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'
    - id: telos-ui-sidebar
      name: '@telos/dsh-client-ui-sidebar'
    - id: telos-continuity
      name: '@telos/dsh-continuity'
      config:
        databasePath: !!js dshHomePath('telos', 'personal-continuity.sqlite')
        maxRecallClaims: 8
        maxRecallChars: 2400
        graphDepth: 2
        captureTurnSources: true
        queueInference: true
        formationMaxInputBytes: 16000
        formationMaxOutputTokens: 4096
        formationTimeoutMs: 60000
    - id: telos-mcp-manager
      name: '@telos/dsh-mcp-manager'
      config:
        storePath: !!js dshHomePath('telos', 'mcp-servers.json')
    - id: telos-multimodal
      name: '@telos/dsh-multimodal'
      config:
        storePath: !!js dshHomePath('telos', 'multimodal-settings.json')
    - id: telos-personalization
      name: '@telos/dsh-personalization'
      config:
        instructionsPath: !!js dshHomePath('AGENTS.md')
    - id: telos-multi-root-workspace
      name: '@telos/dsh-multi-root-workspace'
      config:
        storePath: !!js dshHomePath('telos', 'workspace-groups.json')
    - id: telos-workbench-files
      name: '@telos/dsh-workbench-files'
    - id: telos-work-report
      name: '@telos/dsh-work-report'
      config:
        rootPath: !!js dshHomePath('telos', 'work-report')
