appId: ai.telos.desktop
productName: Telos
copyright: Copyright © 2026 Telos contributors
asar: true
npmRebuild: false
compression: normal
afterPack: build/after-pack.mjs

directories:
  output: ../../dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!out/**/*.map'

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: codexiaoke
  repo: telos
  releaseType: release

mac:
  category: public.app-category.productivity
  # Free open-source distribution: the first launch is approved by the user in
  # macOS Privacy & Security instead of relying on a paid Developer ID.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  sign: false

win:
  # The packaged DSH closure is production-only and symlink-free, so standard
  # NSIS can provide a complete offline installer without a paid certificate.
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Telos

linux:
  category: Utility
  executableName: telos
  target:
    - AppImage
    - deb
