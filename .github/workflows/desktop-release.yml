name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            tag="v${version}"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          product_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$version" != "$product_version" || "$version" != "$desktop_version" ]]; then
            echo "Release version $version does not match package versions ($product_version, $desktop_version)." >&2
            echo "Run pnpm release:bump $version and commit the result before releasing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build complete DSH runtime
        run: pnpm dsh:build
      - name: Verify Telos
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm dsh:verify

  package:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x64
          - runner: windows-2025
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build complete DSH runtime
        run: pnpm dsh:build
      - name: Detect macOS signing mode
        id: mac-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "Manual build will use an ad-hoc signature because these secrets are missing: ${missing[*]}"
          else
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          fi
      - name: Package signed and notarized macOS desktop
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package-desktop.mjs --config.extraMetadata.version=${{ needs.metadata.outputs.version }}
      - name: Verify macOS signature, notarization ticket, and Gatekeeper acceptance
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name 'Telos.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged Telos.app was not found." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Authority=Developer ID Application:"* ]]; then
            echo "Telos.app is not signed with a Developer ID Application identity." >&2
            echo "$signature" >&2
            exit 1
          fi
          xcrun stapler validate "$app_path"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");GitHub Actions;" "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xattr -d com.apple.quarantine "$app_path"

          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "Signed macOS DMG was not found." >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            codesign --verify --strict --verbose=2 "$dmg"
          done
      - name: Package ad-hoc signed macOS desktop when Developer ID is unavailable
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'ad-hoc'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          node scripts/package-desktop.mjs
          --config.extraMetadata.version=${{ needs.metadata.outputs.version }}
          --config.mac.identity=-
          --config.mac.hardenedRuntime=false
          --config.mac.notarize=false
          --config.dmg.sign=false
      - name: Verify ad-hoc macOS application signature
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'ad-hoc'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name 'Telos.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged Telos.app was not found." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if [[ "$signature" != *"Signature=adhoc"* ]]; then
            echo "Telos.app does not have the expected ad-hoc signature." >&2
            echo "$signature" >&2
            exit 1
          fi
      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package-desktop.mjs --config.extraMetadata.version=${{ needs.metadata.outputs.version }}
      - name: Upload macOS desktop artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Telos-${{ needs.metadata.outputs.version }}-${{ matrix.artifact }}-${{ steps.mac-signing.outputs.mode }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
      - name: Upload Windows desktop artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Telos-${{ needs.metadata.outputs.version }}-${{ matrix.artifact }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.7z
            dist/latest*.yml
            dist/*.blockmap

  release:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install release metadata dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter telos
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Prepare cross-platform release artifacts
        run: node scripts/prepare-release-artifacts.mjs downloaded-artifacts release-artifacts
      - name: Generate release checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -d '' -t files < <(find release-artifacts -maxdepth 1 -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No prepared desktop release artifacts were found." >&2
            exit 1
          fi
          release_notes=""
          if find downloaded-artifacts -mindepth 1 -maxdepth 1 -type d -name '*-ad-hoc' -print -quit | grep -q .; then
            release_notes=$'## macOS 首次安装说明\n\n当前 macOS 安装包使用免费的 ad-hoc 完整签名，未经 Apple 公证。若 macOS 阻止首次打开，请将 Telos 拖入“应用程序”，然后在终端执行：\n\n```bash\nxattr -dr com.apple.quarantine /Applications/Telos.app\nopen /Applications/Telos.app\n```\n\n此操作只移除当前下载文件的隔离属性；请仅从本仓库的正式 Release 下载。'
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --title "Telos $RELEASE_TAG"
          else
            release_args=(--generate-notes --title "Telos $RELEASE_TAG")
            if [[ -n "$release_notes" ]]; then release_args+=(--notes "$release_notes"); fi
            gh release create "$RELEASE_TAG" "${release_args[@]}" "${files[@]}"
          fi
