name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            tag="v${version}"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          product_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$version" != "$product_version" || "$version" != "$desktop_version" ]]; then
            echo "Release version $version does not match package versions ($product_version, $desktop_version)." >&2
            echo "Run pnpm release:bump $version and commit the result before releasing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build complete DSH runtime
        run: pnpm dsh:build
      - name: Verify Telos
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm dsh:verify

  package:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x64
          - runner: windows-2025
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      # Telos is distributed as a free open-source build. Do not discover or
      # import paid Apple/Windows identities on GitHub-hosted runners.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build complete DSH runtime
        run: pnpm dsh:build
      - name: Package desktop
        shell: bash
        run: pnpm package:desktop -- --config.extraMetadata.version=${{ needs.metadata.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Telos-${{ needs.metadata.outputs.version }}-${{ matrix.artifact }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.7z
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap

  release:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install release metadata dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter telos
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Prepare cross-platform release artifacts
        run: node scripts/prepare-release-artifacts.mjs downloaded-artifacts release-artifacts
      - name: Generate release checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -d '' -t files < <(find release-artifacts -maxdepth 1 -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No prepared desktop release artifacts were found." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --title "Telos $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --generate-notes --title "Telos $RELEASE_TAG" "${files[@]}"
          fi
