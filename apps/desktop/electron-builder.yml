appId: ai.telos.desktop
productName: Telos
copyright: Copyright © 2026 Telos contributors
asar: true
npmRebuild: false
compression: normal
afterPack: ../../scripts/after-pack-desktop.mjs

directories:
  output: ../../dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!out/**/*.map'

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: codexiaoke
  repo: telos
  releaseType: draft

mac:
  category: public.app-category.productivity
  # Free open-source distribution: the first launch is approved by the user in
  # macOS Privacy & Security instead of relying on a paid Developer ID.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  sign: false

win:
  # With CSC identity discovery disabled in CI, this produces an unsigned NSIS
  # community installer and does not require an Authenticode certificate.
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Telos

linux:
  category: Utility
  target:
    - AppImage
    - deb
